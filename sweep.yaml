command:
  - ${env}
  - ${interpreter}
  - ${program}
  - ${args_no_hyphens}
method: grid
metric:
  goal: maximize
  name: reward
parameters:
  --env_name:
    values:
      - dm_control/dog-walk
      # - dm_control/dog-run
      # - dm_control/dog-trot
      # - dm_control/dog-stand
      # - dm_control/humanoid-run
      # - dm_control/humanoid-walk
      # - dm_control/humanoid-stand
  --seed:
    values:
      - 0
      - 1
      - 2
      - 3
      - 4
  --model:
    values:
      - diffusion
      - consistency

program: online_dm.py


