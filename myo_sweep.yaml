  goal: maximize
  name: reward
parameters:
  env_name:
    values:
      - myoHandObjHoldRandom-v0 
  seed:
    values:
      - 0
      - 1
      - 2
      - 3
      - 4
  model:
    values:
      - diffusion

program: online_myo.py


